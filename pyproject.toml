[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-category-picker"
version = "0.1.0"
description = "CLI for KDP authors to browse Amazon categories, validate fit, and export picks."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Asdale Dynamics, LLC", email = "dylanasdale@users.noreply.github.com"}]
keywords = ["kdp", "amazon", "kindle", "categories", "cli", "authors", "publishing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
kdp-cat = "kdp_category_picker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kdp_category_picker*"]
